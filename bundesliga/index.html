<script>
  // Make the league tabs navigate
  (function(){
    function go(btn){ var url = btn.getAttribute('data-href'); if(url){ location.href = url; } }
    document.querySelectorAll('.league-tabs .tab').forEach(function(btn){
      btn.addEventListener('click', function(){ go(btn); });
    });
  })();
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // Helper: detect the current league folder from the URL path
  function currentLeagueFolder() {
    const parts = location.pathname.split('/').filter(Boolean);
    const i = parts.findIndex(p => ['premier','bundesliga','laliga'].includes(p));
    return i >= 0 ? parts[i] : 'premier';
  }

  const leagueFolder = currentLeagueFolder();

  // Top nav buttons
  document.querySelectorAll(".nav-item").forEach(item => {
    const label = item.querySelector("span")?.textContent.trim().toLowerCase();
    item.addEventListener("click", () => {
      if (label === "home")     location.href = "index.html";         // relative -> stays in this folder
      if (label === "results")  location.href = "results.html";       // relative -> /<league>/results.html
      if (label === "winners")  alert("Winners page coming soon!");
      if (label === "rules")    alert("Rules page coming soon!");
    });
  });

  // League tabs (always go to the specific folder root)
  document.querySelectorAll(".league-tabs .tab").forEach(tab => {
    const target = tab.getAttribute("data-href");
    if (target) {
      tab.addEventListener("click", () => location.href = target);
    }
  });

  // Bet button – ALWAYS within the current folder
  const betButton = document.getElementById("bet-button-main");
  if (betButton) {
    betButton.addEventListener("click", (e) => {
      e.preventDefault();
      location.href = "predictions.html"; // relative -> /<league>/predictions.html
    });
  }

  // If you also click match cards to go to predictions:
  document.addEventListener("click", (e) => {
    const card = e.target.closest(".match-card");
    if (!card) return;
    // (Optionally store selected match id in localStorage here)
    location.href = "predictions.html";
  });
});
</script>


<!-- NEW: match-card + Bet button hooks -->
<script>
  // When user clicks a match card → SINGLE mode
  document.addEventListener('click', (e) => {
    const card = e.target.closest('.match-card');
    if (!card) return;
    const fixtureId = String(card.dataset.fixture || card.dataset.fixtureId || '').trim();
    if (!fixtureId) return;
    sessionStorage.setItem('FBL_mode', 'single');
    sessionStorage.setItem('FBL_selectedFixture', fixtureId);
    // predictions.html lives in the same league folder
    location.href = 'predictions.html';
  });

  // Bet button → ALL mode
  const betBtn = document.getElementById('bet-button-main');
  if (betBtn) {
    betBtn.addEventListener('click', (e) => {
      e.preventDefault();
      sessionStorage.setItem('FBL_mode', 'all');
      sessionStorage.removeItem('FBL_selectedFixture'); // avoid sticky single-match
      location.href = 'predictions.html';
    });
  }
</script>
</body>
