<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- AFCON league meta -->
  <meta name="league" content="AFCON" />

  <title data-i18n="afcon.predictions.title">FansBetLiga — AFCON Predictions</title>

  <link rel="stylesheet" href="/styles/styles.css" />
</head>

<body data-league="AFCON">
  <header class="topbar2">
    <h1 class="logo2" data-i18n="app.brand">FANSBETLIGA</h1>

    <button class="bell-btn has-unread" id="bellBtn"
      aria-label=""
      data-i18n-attr="aria-label"
      data-i18n-key="nav.notificationsAria"
      aria-expanded="false">
      <img src="/img/Doorbell.png" alt="" class="bell-icon"
        data-i18n-attr="alt"
        data-i18n-key="nav.notificationsAlt" />
    </button>
      <!-- unread dot is CSS -->
    </button>
  </header>

  <!-- Full page notifications / wallet panel -->
  <section class="bell-page" id="bellPage" aria-hidden="true">
    <div class="bell-page__inner">
      <div class="bell-page__top">
        <h2 class="bell-page__title" data-i18n="nav.notifications">Notifications</h2>
        <button
          class="bell-close"
          id="bellClose"
          aria-label="Close"
          data-i18n-attr="aria-label"
          data-i18n="common.closeAria"
        >✕</button>
      </div>

      <div class="tab-row">
        <a class="tab-card" href="">
          <span class="tab-label" data-i18n="wallet.withdrawBonus">Withdraw Bonus</span>
          <span class="tab-arrow">›</span>
        </a>
      </div>

      <div class="tab-row">
        <a class="tab-card" href="/afcon/wallet.html">
          <span class="tab-label" data-i18n="wallet.wallet">Wallet</span>
          <span class="tab-arrow">›</span>
        </a>
      </div>
    </div>
  </section>

  <script>
    const bellBtn = document.getElementById("bellBtn");
    const bellPage = document.getElementById("bellPage");
    const bellClose = document.getElementById("bellClose");

    function openBellPage() {
      bellPage.classList.add("open");
      bellPage.setAttribute("aria-hidden", "false");
      bellBtn.setAttribute("aria-expanded", "true");
    }

    function closeBellPage() {
      bellPage.classList.remove("open");
      bellPage.setAttribute("aria-hidden", "true");
      bellBtn.setAttribute("aria-expanded", "false");
    }

    bellBtn.addEventListener("click", () => {
      const isOpen = bellPage.classList.contains("open");
      if (isOpen) closeBellPage();
      else openBellPage();
    });

    bellClose.addEventListener("click", closeBellPage);

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeBellPage();
    });
  </script>

  <!-- same bottom nav as other leagues -->
  <nav class="nav">
    <div class="nav-item"><img src="/img/home.png" alt="Home"><span data-i18n="nav.home">Home</span></div>
    <div class="nav-item"><img src="/img/results.png" alt="Results"><span data-i18n="nav.results">Results</span></div>
    <div class="nav-item"><img src="/img/winners.png" alt="Winners"><span data-i18n="nav.winners">Winners</span></div>
    <div class="nav-item"><img src="/img/rules.png" alt="Rules"><span data-i18n="nav.rules">Rules</span></div>
  </nav>

  <section class="predictions">
    <div class="matches-header">
      <div class="left">
        <a href="index.html" class="back-arrow">&lt;</a>
        <h2 data-i18n="common.matches">Matchs</h2>
      </div>
      <a href="" id="done" class="done" data-i18n="common.done">Done</a>
    </div>

    <div class="contain">
      <!-- initial text; predictionsPage.js will overwrite -->
      <h1 class="subtitle">
        <span class="bold" data-i18n="afcon.predictions.groupMatches">AFCON Group Matches</span>
        <span> - </span>
        <span data-i18n="afcon.predictions.matchdayOf" data-i18n-vars="n:1,total:3">Matchday 1 of 3</span>
      </h1>

      <div class="page-controls2">
        <button
          id="prev-day"
          class="arrow2"
          aria-label="Previous"
          data-i18n-attr="aria-label"
          data-i18n="common.prevAria"
        >&lt;</button>

        <span id="day-number2">1</span>

        <button
          id="next-day"
          class="arrow2"
          aria-label="Next"
          data-i18n-attr="aria-label"
          data-i18n="common.nextAria"
        >&gt;</button>
      </div>
    </div>

    <div id="predictions-list"></div>
  </section>

  <!-- Confirmation modal -->
  <div id="gprompt-overlay" aria-hidden="true">
    <div class="gprompt__backdrop"></div>
    <div class="gprompt__dialog" role="dialog" aria-modal="true" aria-labelledby="gprompt-title">
      <button
        id="gprompt-close"
        class="gprompt__x"
        type="button"
        aria-label="Close"
        data-i18n-attr="aria-label"
        data-i18n="common.closeAria"
      >×</button>

      <h3
        id="gprompt-title"
        class="gprompt__title"
        data-i18n="predictions.confirmTitle"
      >
        Are you sure you want to submit these scores? Please confirm that all the information is correct.
      </h3>

      <div class="gprompt__subtitle">
        <span class="gprompt__badge" data-i18n="afcon.predictions.badge">AFCON Matches</span>
        –
        <span>Matchday</span>
        <span id="gprompt-matchday">1 of 3</span>
      </div>

      <div id="confirmList" class="gprompt__list" role="list"></div>

      <div class="gprompt__actions">
        <button id="gprompt-cancel" class="gprompt__btn" type="button" data-i18n="common.cancel">Cancel</button>
        <button id="gprompt-confirm" class="gprompt__btn gprompt__btn--primary" type="button" data-i18n="common.confirm">
          Confirm
        </button>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Firebase SDKs (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="../scripts/firebase-init.js"></script>
  <script src="../scripts/predictionsStore.js"></script>
  <script src="../scripts/auth.js"></script>

  <!-- existing global config + API + predictions logic -->
  <script src="../scripts/config.js"></script>
  <script src="../scripts/api.js"></script>
  <script src="afconFixtures.js"></script>

  <!-- ✅ i18n -->
  <script src="../scripts/translations.en.js"></script>
  <script src="../scripts/translations.fr.js"></script>
  <script src="../scripts/i18n.js"></script>
  <script>
    window.FBL_I18N && window.FBL_I18N.applyLang && window.FBL_I18N.applyLang();
  </script>

  <script src="../scripts/predictionsPage.js"></script>

  <!-- NAV scripts (unchanged; only added i18n spans above) -->
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const path = window.location.pathname.toLowerCase();
    let league = "";
    if (path.includes("laliga")) league = "laliga";
    else if (path.includes("bundesliga")) league = "bundesliga";
    else if (path.includes("premier")) league = "premier";
    else if (path.includes("afcon")) league = "afcon";

    const navItems = document.querySelectorAll(".navbar .nav-item");
    navItems.forEach(item => {
      const label = item.querySelector("p")?.textContent.trim().toLowerCase() || "";

      item.addEventListener("click", () => {
        switch (label) {
          case "home":
            window.location.href = `/${league}/index.html`;
            break;
          case "results":
            window.location.href = `/${league}/results.html`;
            break;
          case "winners":
            window.location.href = `/${league}/winners.html`;
            break;
          case "rules":
            alert("⚙️ Rules page coming soon!");
            break;
        }
      });
    });

    const tabs = document.querySelectorAll(".league-tabs .tab");
    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        const target = tab.getAttribute("data-href");
        if (target) window.location.href = target;
      });
    });

    tabs.forEach(tab => {
      const href = (tab.getAttribute("data-href") || "").toLowerCase();
      if (path.includes("laliga") && href.includes("laliga")) tab.classList.add("active");
      else if (path.includes("bundesliga") && href.includes("bundesliga")) tab.classList.add("active");
      else if (path.includes("premier") && href.includes("premier")) tab.classList.add("active");
      else if (path.includes("afcon") && href.includes("afcon")) tab.classList.add("active");
      else tab.classList.remove("active");
    });
  });
  </script>

  <script>
  window.addEventListener('DOMContentLoaded', function () {
    const nav = document.querySelector('nav.nav');
    if (!nav) return;

    const items = Array.from(nav.querySelectorAll('.nav-item'));

    function setActiveByLabel(label) {
      const targetLabel = label.toLowerCase();
      items.forEach(i => i.classList.remove('nav-active'));

      const found = items.find(i => {
        const text = (i.querySelector('span')?.textContent || "").trim().toLowerCase();
        return text === targetLabel;
      });

      if (found) {
        found.classList.add('nav-active');
      }
    }

    const path = window.location.pathname.toLowerCase();

    if (path.includes('results')) {
      setActiveByLabel('results');
    } else if (path.includes('winners')) {
      setActiveByLabel('winners');
    } else if (path.includes('rules')) {
      setActiveByLabel('rules');
    } else {
      setActiveByLabel('home');
    }

    nav.addEventListener('click', function (e) {
      const item = e.target.closest('.nav-item');
      if (!item || !nav.contains(item)) return;

      items.forEach(i => i.classList.remove('nav-active'));
      item.classList.add('nav-active');
    });
  });
  </script>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".nav-item").forEach(item => {
      const label = item.querySelector("span")?.textContent.trim().toLowerCase();
      item.addEventListener("click", () => {
        if (label === "home")     location.href = "index.html";
        if (label === "results")  location.href = "results.html";
        if (label === "winners") location.href = "winners.html";
        if (label === "rules")    alert("Rules page coming soon!");
      });
    });

    document.querySelectorAll(".league-tabs .tab").forEach(tab => {
      const target = tab.getAttribute("data-href");
      if (target) tab.addEventListener("click", () => location.href = target);
    });

    const betButton = document.getElementById("bet-button-main");
    if (betButton) {
      betButton.addEventListener("click", (e) => {
        e.preventDefault();
        location.href = "predictions.html";
      });
    }
  });
  </script>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const tabs = document.querySelectorAll('.league-tabs .tab');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        const href = tab.dataset.href;
        if (href) {
          window.location.href = href;
        }
      });
    });
  });
  </script>
</body>
</html>
