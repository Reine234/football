<script>
document.addEventListener("DOMContentLoaded", () => {
  const path = window.location.pathname.toLowerCase();
  let league = "";
  if (path.includes("laliga")) league = "laliga";
  else if (path.includes("bundesliga")) league = "bundesliga";
  else if (path.includes("premier")) league = "premier";

  // ====== NAVBAR LINKS ======
  const navItems = document.querySelectorAll(".navbar .nav-item");
  navItems.forEach(item => {
    const label = item.querySelector("p").textContent.trim().toLowerCase();

    item.addEventListener("click", () => {
      switch (label) {
        case "home":
          window.location.href = `/${league}/index.html`;
          break;
        case "results":
          window.location.href = `/${league}/results.html`;
          break;
        case "winners":
          alert("🏆 Winners page coming soon!");
          break;
        case "rules":
          alert("⚙️ Rules page coming soon!");
          break;
      }
    });
  });

  // ====== LEAGUE TABS ======
  const tabs = document.querySelectorAll(".league-tabs .tab");
  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      const target = tab.getAttribute("data-href");
      if (target) window.location.href = target;
    });
  });

  // ====== HIGHLIGHT ACTIVE LEAGUE TAB ======
  tabs.forEach(tab => {
    const href = tab.getAttribute("data-href").toLowerCase();
    if (path.includes("laliga") && href.includes("laliga")) tab.classList.add("active");
    else if (path.includes("bundesliga") && href.includes("bundesliga")) tab.classList.add("active");
    else if (path.includes("premier") && href.includes("premier")) tab.classList.add("active");
    else tab.classList.remove("active");
  });
});
</script><script>
  window.addEventListener('DOMContentLoaded', function () {
    const nav = document.querySelector('nav.nav');
    if (!nav) return;

    const items = Array.from(nav.querySelectorAll('.nav-item'));

    // Helper: remove active from all, then add to the one whose label matches
    function setActiveByLabel(label) {
      const targetLabel = label.toLowerCase();
      items.forEach(i => i.classList.remove('nav-active'));

      const found = items.find(i => {
        const text = (i.querySelector('span')?.textContent || "").trim().toLowerCase();
        return text === targetLabel;
      });

      if (found) {
        found.classList.add('nav-active');
      }
    }

    // 1) On page load, decide which tab should be active based on URL
    const path = window.location.pathname.toLowerCase(); // e.g. "/premier/results.html"

    if (path.includes('results')) {
      setActiveByLabel('results');
    } else if (path.includes('winners')) {
      setActiveByLabel('winners');
    } else if (path.includes('rules')) {
      setActiveByLabel('rules');
    } else {
      // default: Home
      setActiveByLabel('home');
    }

    // 2) Optional: if some tabs don't navigate yet and you still
    // want them to glow when clicked on the same page:
    nav.addEventListener('click', function (e) {
      const item = e.target.closest('.nav-item');
      if (!item || !nav.contains(item)) return;

      // If this click navigates to another page (like "Results"),
      // the new page will set the right tab on load using the code above.
      items.forEach(i => i.classList.remove('nav-active'));
      item.classList.add('nav-active');
    });
  });
</script>
