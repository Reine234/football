<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="league" content="PD" />
  <title>FansBetLiga - Results</title>
  <link rel="stylesheet" href="/styles/styless.css" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
 
</head>
<body>
  <header class="header"><div class="logo">FANSBETLIGA</div><div class="about">About</div></header>

  <nav class="nav">
    <div class="nav-item active"><img src="/img/home.png" alt="Home"><span>Home</span></div>
    <div class="nav-item selected"><img src="/img/person.png" alt="Results"><span>Results</span></div>
    <div class="nav-item"><img src="/img/books.png" alt="Winners"><span>Winners</span></div>
    <div class="nav-item"><img src="/img/3 dots.png" alt="Rules"><span>Rules</span></div>
  </nav>

  <div class="league-tabs">
    <button class="tab" data-href="../laliga/results.html">La Liga</button>
    <button class="tab" data-href="../bundesliga/results.html">Bundesliga</button>
    <button class="tab active" data-href="../premier/results.html">Premier League</button>
    
  </div>

  <div class="season-title"><span class="back-arrow">&lt;</span><h2>Preseason 2025 - 2026</h2></div>

  <div class="user-info"><span>–</span><span class="points">Points: 0</span></div>

  <section class="matches">
    <div class="matches-header"><h3>Matches - Matchday 1 of 3</h3><span class="arrow">&gt;</span></div>
    <!-- result cards injected here --><div id="results-list"></div>

  </section>

  <script>
    (function(){
      function go(btn){ var url = btn.getAttribute('data-href'); if(url){ location.href = url; } }
      document.querySelectorAll('.league-tabs .tab').forEach(function(btn){
        btn.addEventListener('click', function(){ go(btn); });
      });
    })();
</script>
<script>
  window.FBL_RESULTS_LEAGUE_KEY = 'LALIGA';
</script>




<!-- Firebase SDKs (compat version for simple global usage) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../scripts/firebase-init.js"></script>
<script src="../scripts/config.js"></script>
<script src="../scripts/api.js"></script>
<script src="../scripts/auth.js"></script>
<script src="../scripts/predictionsStore.js"></script>
<script src="../scripts/resultsPage.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  // Determine which league this page belongs to
  const path = window.location.pathname.toLowerCase();
  let league = "";
  if (path.includes("laliga")) league = "laliga";
  else if (path.includes("bundesliga")) league = "bundesliga";
  else if (path.includes("premier")) league = "premier";

  // Handle top nav clicks
  const navItems = document.querySelectorAll(".nav-item");
  navItems.forEach(item => {
    const label = item.querySelector("span").textContent.trim().toLowerCase();

    item.addEventListener("click", () => {
      if (label === "home") {
        window.location.href = `../${league}/index.html`;
      } 
      else if (label === "results") {
        window.location.href = `../${league}/results.html`;
      } 
      else if (label === "winners") {
        alert("Winners page coming soon!");
      } 
      else if (label === "rules") {
        alert("Rules page coming soon!");
      }
    });
  });

  // Handle league tab switching (La Liga / Bundesliga / Premier)
  const tabs = document.querySelectorAll(".league-tabs .tab");
  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      const target = tab.getAttribute("data-href");
      if (target) window.location.href = target;
    });
  });

  // Optional: visually mark active tab automatically
  tabs.forEach(tab => {
    const href = tab.getAttribute("data-href").toLowerCase();
    if (path.includes("laliga") && href.includes("laliga")) tab.classList.add("active");
    else if (path.includes("bundesliga") && href.includes("bundesliga")) tab.classList.add("active");
    else if (path.includes("premier") && href.includes("premier")) tab.classList.add("active");
    else tab.classList.remove("active");
  });
});
</script>


<script>
(function(){
  const h3 = document.querySelector('.matches-header h3');
  if (!h3) return;

  let rounds = [];
  try { rounds = JSON.parse(sessionStorage.getItem('FBL_rounds') || '[]') || []; } catch {}
  const idxStr = sessionStorage.getItem('FBL_roundIndex');
  const idx = (idxStr !== null && idxStr !== '' && !Number.isNaN(Number(idxStr))) ? parseInt(idxStr, 10) : -1;

  let num = 1, total = rounds.length || 38;
  try {
    const ctx = JSON.parse(sessionStorage.getItem('FBL_selectedRound') || 'null');
    if (ctx) {
      if (idx < 0 && Number.isInteger(ctx.roundNum)) num = ctx.roundNum;
      if (!rounds.length && Number.isInteger(ctx.roundTotal)) total = ctx.roundTotal;
    }
    if (idx >= 0) num = idx + 1;
  } catch {}

  // Keep your exact wording/layout:
  h3.textContent = `Matches - Matchday ${num} of ${total}`;
})();
</script>

</body></html>
