        <input id="email" name="email" type="email" class="input" placeholder="Email" />

        <label class="sr-only" for="password">Password</label>
        <input id="password" name="password" type="password" class="input" placeholder="Password" />

        <label class="sr-only" for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" class="input" placeholder="Confirm password" />

        <button type="submit" class="btn-primary">Sign up</button>
      </form>

<script>
async function flushPendingPredictionsAfterAuth() {
  try {
    const raw = sessionStorage.getItem("pending_predictions");
    if (!raw) return;

    const pending = JSON.parse(raw || "[]");
    if (!Array.isArray(pending) || pending.length === 0) return;

    // leagueKey + matchday are inside the payload you already build
    const leagueKey =
      (pending[0].league || sessionStorage.getItem("FBL_leagueKey") || "")
        .toUpperCase();

    const matchday = Number(pending[0].matchday || 1);

    if (!window.FBL_STORE || !window.FBL_STORE.savePredictionsForRound) {
      console.warn("[AFTER_AUTH] FBL_STORE not ready, cannot flush pending.");
      return;
    }

    console.log("[AFTER_AUTH] flushing pending predictions:", pending.length);

    await window.FBL_STORE.savePredictionsForRound(leagueKey, matchday, pending);

    // clean up so we don't re-save
    sessionStorage.removeItem("pending_predictions");
  } catch (e) {
    console.warn("[AFTER_AUTH] flush failed:", e);
  }
}

</script>

<script>
(function () {
  const APP_BASE =
    (window.FBL_CFG && window.FBL_CFG.APP_BASE) ||
    window.location.origin;

  function folderFromLeagueKey(k){
    if (k === "LIGUE1") return "ligue1";
    if (k === "LALIGA") return "laliga";
    if (k === "BUNDESLIGA") return "bundesliga";
    return "premier";
  }

  function resultsUrl(){
    const k = sessionStorage.getItem("FBL_leagueKey") || "PREMIER_LEAGUE";
    return APP_BASE.replace(/\/$/,'') + '/' + folderFromLeagueKey(k) + '/results.html';
  }

  function getNext(){
    const q = new URLSearchParams(location.search);
    return q.get("next") || resultsUrl();
  }

  function goNext(){
    location.replace(getNext());
  }

  // ---- wait for Firebase init safely ----
  function getAuthSafe(){
    if (window.FBL_FIREBASE && window.FBL_FIREBASE.auth) return window.FBL_FIREBASE.auth;
    if (window.firebase && firebase.auth) return firebase.auth(); // compat fallback
    return null;
  }

  function whenAuthReady(cb){
    const authNow = getAuthSafe();
    if (authNow) return cb(authNow);

    const iv = setInterval(() => {
      const a = getAuthSafe();
      if (a) {
        clearInterval(iv);
        cb(a);
      }
    }, 80);
  }

  // reusable hook after successful auth
  window.__FBL_AFTER_AUTH__ = goNext;

  // If already logged in → go next
  whenAuthReady((auth) => {
    auth.onAuthStateChanged((user) => {
      if (user) {
        sessionStorage.setItem(
          "fbl_current_user",
          JSON.stringify({
            uid: user.uid,
            email: user.email || "",
            username: user.displayName || ""
          })
        );
        goNext();
      }
    });
  });

  // ---- Signup submit ----
  document.getElementById("signup-form").addEventListener("submit", async function (e) {
    e.preventDefault();

    const auth = getAuthSafe();
    if (!auth) return alert("Firebase is still loading. Refresh and try again.");

    const username = this.username.value.trim();
    const email    = this.email.value.trim();
    const pass     = this.password.value.trim();
    const confirm  = this.confirm.value.trim();

    if (!username || !email || !pass || !confirm) {
      return alert("Please fill all fields.");
    }
    if (pass !== confirm) {
      return alert("Passwords do not match.");
    }

    try {
      // try signup first
      const cred = await auth.createUserWithEmailAndPassword(email, pass);

      if (cred.user) {
        await cred.user.updateProfile({ displayName: username });
      }

      (window.__FBL_AFTER_AUTH__ || goNext)();
      return;

    } catch (err) {
      console.warn("[Signup] createUser error:", err);

      // If email already exists → try sign in automatically
      if (err && err.code === "auth/email-already-in-use") {
        try {
          await auth.signInWithEmailAndPassword(email, pass);
          (window.__FBL_AFTER_AUTH__ || goNext)();
          return;
        } catch (e2) {
          alert("Email already exists. Please sign in instead.");
          // keep next param so user still returns to results
          location.href = "signin.html?next=" + encodeURIComponent(getNext());
          return;
        }
      }

      alert(err.message || "Signup failed.");
    }
  });
})();
</script>
