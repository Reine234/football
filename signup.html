<head>
  <meta charset="utf-8" />

  <!-- silence favicon 404 -->
  <link rel="icon" href="data:,">

<body>
  <header class="topbar">
    <div class="brand">FANSBETLIGA</div>
    <a href="#" class="about">About</a>
  </header>

  <main class="shell">
    <section class="auth-card">
      <h1 class="title">Create your account</h1>

      <form id="signup-form" class="form">
        <label class="sr-only" for="username">Username</label>
        <input id="username" name="username" type="text" class="input" placeholder="Username" />

        <label class="sr-only" for="email">Email</label>
        <input id="email" name="email" type="email" class="input" placeholder="Email" />

        <label class="sr-only" for="password">Password</label>
        <input id="password" name="password" type="password" class="input" placeholder="Password" />

        <label class="sr-only" for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" class="input" placeholder="Confirm password" />

        <button type="submit" class="btn-primary">Sign up</button>
      </form>






       


      
      </div>
<script>
(function(){
  const API_BASE = (window.FBL_CFG && window.FBL_CFG.API_BASE) || 'http://localhost:8080';
  const APP_BASE = (window.FBL_CFG && window.FBL_CFG.APP_BASE) || 'http://localhost:5000';

  function folderFromLeagueKey(k){
    if (k === 'LALIGA')     return 'laliga';
    if (k === 'BUNDESLIGA') return 'bundesliga';
    if (k === 'LIGUE1')     return 'ligue1';
    return 'premier';
  }

  function resultsUrl(){
    const k = sessionStorage.getItem('FBL_leagueKey') || 'PREMIER_LEAGUE';
    return APP_BASE.replace(/\/$/,'') + '/' + folderFromLeagueKey(k) + '/results.html';
  }

  function getNext(){
    const q = new URLSearchParams(location.search);
    return q.get('next') || resultsUrl();
  }

  // If already logged in → skip signup and go to results
  fetch(`${API_BASE.replace(/\/$/,'')}/api/users.php?action=session`, {
      credentials: 'include'
    })
    .then(r => r.json())
    .then(j => {
      if (j && j.success) {
        location.replace(getNext());
      }
    })
    .catch(() => {});

  // Common hook AFTER signup/login succeeds
  // (auth.js: FBL_AUTH.redirectAfterAuth() respects ?next=…)
  window.__FBL_AFTER_AUTH__ = function(){
    if (window.FBL_AUTH && typeof window.FBL_AUTH.redirectAfterAuth === "function") {
      window.FBL_AUTH.redirectAfterAuth();
    } else {
      location.replace(getNext());
    }
  };

  // Email/password signup – use FBL_AUTH so pending_predictions are flushed
  const form = document.getElementById("signup-form");
  if (form) {
    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const username = this.username.value.trim();
      const email    = this.email.value.trim();
      const pass     = this.password.value.trim();
      const confirm  = this.confirm.value.trim();

      if (!username || !email || !pass || !confirm) {
        alert('Please fill all fields.');
        return;
      }
      if (pass !== confirm) {
        alert('Passwords do not match.');
        return;
      }

      try {
        if (window.FBL_AUTH && typeof window.FBL_AUTH.signUp === "function") {
          // 🔴 This calls /api/users.php?action=signup AND flushes pending_predictions
          await window.FBL_AUTH.signUp(username, email, pass);
        } else {
          // Fallback (should almost never be used)
          const res = await fetch(`${API_BASE.replace(/\/$/,'')}/api/users.php`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ action: 'signup', username, email, password: pass })
          }).then(r => r.json());

          if (!res || !res.success) {
            alert(res && res.message ? res.message : 'Signup failed.');
            return;
          }
        }

        // Now that we have a PHP session and predictions are saved → go to results
        window.__FBL_AFTER_AUTH__();
      } catch (err) {
        console.error(err);
        alert(err && err.message ? err.message : 'Signup failed.');
      }
    });
  }
})();
</script>



      <p class="switch">
        Already have an account?
        <a href="signin.html">Sign in</a>
      </p>
    </section>
  </main>

  <!-- REPLACE your entire Google init script with THIS clean version -->
<script>
(function () {
  const onloadDiv = document.getElementById('g_id_onload');
  const googleBtn = document.getElementById('g_id_signin');

  // Trim spaces; also fallback from config.js if needed
  const clientId = ((onloadDiv?.dataset?.client_id || window.FBL_GOOGLE_CLIENT_ID || '') + '').trim();

  let initialized = false;

  function initGoogle() {
    if (initialized) return true;
    if (!window.google || !google.accounts || !google.accounts.id) return false;
    if (!clientId) {
      console.warn("Missing Google Client ID");
      return false;
    }

    google.accounts.id.initialize({
      client_id: clientId,
      callback: window.fblGoogleOneTap,   // your existing handler
      ux_mode: "popup"                    // ⬅ popup only (NO origin checks)
    });

    initialized = true;
    return true;
  }

  // Wait for GSI SDK to load, try init
  const interval = setInterval(() => {
    if (initGoogle()) clearInterval(interval);
  }, 150);

  // When clicking the Google button → open popup
  if (googleBtn) {
    googleBtn.addEventListener("click", (e) => {
      e.preventDefault();
      if (!initGoogle()) {
        alert("Google is still loading… try again.");
        return;
      }
      google.accounts.id.prompt();   // ⬅ opens popup selector
    });
  }
})();
</script>
</body></html>
