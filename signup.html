<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FansBetLiga — Sign up</title>

  <!-- keep your stylesheet -->
  <link rel="stylesheet" href="./styles/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">FANSBETLIGA</div>
    <a href="#" class="about">About</a>
  </header>

  <main class="shell">
    <section class="auth-card">
      <h1 class="title">Create your account</h1>

      <form id="signup-form" class="form">
        <label class="sr-only" for="username">Username</label>
        <input id="username" name="username" type="text" class="input" placeholder="Username" />

        <label class="sr-only" for="email">Email</label>
        <input id="email" name="email" type="email" class="input" placeholder="Email" />

        <label class="sr-only" for="password">Password</label>
        <input id="password" name="password" type="password" class="input" placeholder="Password" />

        <label class="sr-only" for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" class="input" placeholder="Confirm password" />

        <button type="submit" class="btn-primary">Sign up</button>
      </form>

      <!-- SOCIAL row (kept exactly as your HTML) -->
      <div class="social-row" id="g_id_onload"
           data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
           data-context="signin"
           data-callback="fblGoogleOneTap"
           data-auto_prompt="false">
        <button id="g_id_signin" class="social-btn" type="button" aria-label="Sign up with Google">
          <!-- Google G -->
          <svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true">
            <path fill="#FFC107" d="M43 24c0-1.3-.1-2.6-.4-3.8H24v7.3h10.7c-.5 2.7-2 5-4.3 6.5v5.4h7c4.1-3.8 6.6-9.4 6.6-15.4z"/>
            <path fill="#FF3D00" d="M24 44c5.9 0 10.9-1.9 14.5-5.1l-7-5.4c-2 1.4-4.7 2.2-7.5 2.2-5.8 0-10.7-3.9-12.4-9.1H4.1v5.7C7.7 39.7 15.2 44 24 44z"/>
            <path fill="#4CAF50" d="M11.6 26.5c-.4-1.4-.6-2.9-.6-4.5s.2-3.1.6-4.5V11.8H4.1C2.7 14.6 2 17.7 2 22s.7 7.4 2.1 10.2l7.5-5.7z"/>
            <path fill="#1976D2" d="M24 9.5c3.2 0 6.2 1.1 8.5 3.3l6.4-6.4C35 2.4 29.9 0 24 0 15.2 0 7.7 4.3 4.1 11.8l7.5 5.7C13.3 13.4 18.2 9.5 24 9.5z"/>
          </svg>
        </button>

        <button class="social-btn" type="button" aria-label="Sign up with Facebook">
          <!-- Facebook f -->
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 11.99 0 5.36 0 0 5.4 0 12.07 0 18.1 4.39 23.1 10.12 24v-8.43H7.08V12.1h3.04V9.42c0-3 1.8-4.67 4.55-4.67 1.32 0 2.7.24 2.7.24v2.98h-1.52c-1.5 0-1.97.94-1.97 1.9v2.23h3.35l-.53 3.47h-2.82V24C19.61 23.1 24 18.1 24 12.07z"/>
          </svg>
        </button>
      </div>

      <p class="switch">
        Already have an account?
        <a href="signin.html">Sign in</a>
      </p>
    </section>
  </main>

  <!-- keep your script order; add Google SDK -->
  <script src="./scripts/config.js"></script>
  <script src="./scripts/api.js"></script>
  <script src="./scripts/auth.js"></script>

  <script>
    // 1) Email/password signup – keep your CSS, just use FBL_AUTH
    document.getElementById("signup-form").addEventListener("submit", async function (e) {
      e.preventDefault();

      const username = document.querySelector('#signup-form input[name="username"]').value.trim();
      const email    = document.querySelector('#signup-form input[name="email"]').value.trim();
      const pass     = document.querySelector('#signup-form input[name="password"]').value.trim();
      const confirm  = document.querySelector('#signup-form input[name="confirm"]').value.trim();

      if (!username || !email || !pass || !confirm) return alert("Please fill all fields.");
      if (pass !== confirm) return alert("Passwords do not match.");

      try {
        await window.FBL_AUTH.signUp(username, email, pass);
        window.FBL_AUTH.redirectAfterAuth();
      } catch (err) {
        alert(err.message || "Sign up failed.");
      }
    });

    // 2) Your custom Google button → trigger Google One Tap prompt
    document.getElementById("g_id_signin").addEventListener("click", function () {
      window.FBL_AUTH.googlePrompt();
    });
  </script>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
