  <main class="shell">
    <section class="auth-card">
      <h1 class="title">Sign in</h1>

      <form id="signin-form" class="form">
        <label class="sr-only" for="login-user">Username or Email</label>
        <input id="email" name="login-user" type="text" class="input" placeholder="Username or Email" />

        <label class="sr-only" for="login-pass">Password</label>
        <input id="password" name="login-pass" type="password" class="input" placeholder="Password" />

        <button type="submit" class="btn-primary">Sign in</button>
      </form>
<script>
async function flushPendingPredictionsAfterAuth() {
  try {
    const raw = sessionStorage.getItem("pending_predictions");
    if (!raw) return;

    const pending = JSON.parse(raw || "[]");
    if (!Array.isArray(pending) || pending.length === 0) return;

    // leagueKey + matchday are inside the payload you already build
    const leagueKey =
      (pending[0].league || sessionStorage.getItem("FBL_leagueKey") || "")
        .toUpperCase();

    const matchday = Number(pending[0].matchday || 1);

    if (!window.FBL_STORE || !window.FBL_STORE.savePredictionsForRound) {
      console.warn("[AFTER_AUTH] FBL_STORE not ready, cannot flush pending.");
      return;
    }

    console.log("[AFTER_AUTH] flushing pending predictions:", pending.length);

    await window.FBL_STORE.savePredictionsForRound(leagueKey, matchday, pending);

    // clean up so we don't re-save
    sessionStorage.removeItem("pending_predictions");
  } catch (e) {
    console.warn("[AFTER_AUTH] flush failed:", e);
  }
}

</script>


      <p class="switch">
        Don’t have an account?
        <a href="signup.html">Sign up</a>
      </p>
    </section>
