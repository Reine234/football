<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FansBetLiga — Sign in</title>

  <link rel="stylesheet" href="./styles/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">FANSBETLIGA</div>
    <a href="#" class="about">About</a>
  </header>

  <main class="shell">
    <section class="auth-card">
      <h1 class="title">Sign in</h1>

      <form id="signin-form" class="form">
        <label class="sr-only" for="login-user">Username or Email</label>
        <input id="email" name="login-user" type="text" class="input" placeholder="Username or Email" />

        <label class="sr-only" for="login-pass">Password</label>
        <input id="password" name="login-pass" type="password" class="input" placeholder="Password" />

        <button type="submit" class="btn-primary">Sign in</button>
      </form>





      <p class="switch">
        Don’t have an account?
        <a href="signup.html">Sign up</a>
      </p>
    </section>
  </main>
 
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="./scripts/firebase-init.js"></script>
<script src="./scripts/config.js"></script>
<script src="./scripts/api.js"></script>
<script src="./scripts/auth.js"></script>
<script src="./scripts/signinPage.js" defer></script>

          

</body></html>
