<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="league" content="PL" />
  <title>FansBetLiga — Premier League</title>
 
  
<link rel="stylesheet" href="/styles/styleindex.css">
  
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  
</head>
<body data-league="PREMIER_LEAGUE">
  <header class="topbar">
    <h1 class="logo">FANSBETLIGA</h1>
    <a href="#" class="about">About</a>
  </header>



 <nav class="nav">
    <div class="nav-item "><img src="/img/home.png" alt="Home"><span>Home</span></div>
    <div class="nav-item "><img src="/img/person.png" alt="Results"><span>Results</span></div>
    <div class="nav-item"><img src="/img/books.png" alt="Winners"><span>Winners</span></div>
    <div class="nav-item"><img src="/img/3 dots.png" alt="Rules"><span>Rules</span></div>
  </nav>


  <!-- League tabs -->
  <div class="league-tabs">
    <button class="tab" data-href="/laliga/index.html">La Liga</button>
    <button class="tab" data-href="/bundesliga/index.html">Bundesliga</button>
    <button class="tab active" data-href="/premier/index.html">Premier League</button>
  </div>


  <script>
  // works even if the buttons are created later
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.league-tabs .tab');
    if (!btn) return;
    const href = btn.dataset.href;
    if (href) location.assign(href);
  });
</script>

  


<section class="matches">
  <div class="matches-header">
    <h3 id="matchday-title">Matches</h3>
    <div class="page-controls">
      <button id="prev-day" class="arrow">&lt;</button>
      <span id="day-number"></span>
      <button id="next-day" class="arrow">&gt;</button>
    </div>
  </div>
  <div id="matches-container"></div>
</section>


 <a id="bet-button-main" class="fixed-button" href="/premier/predictions.html">Bet +</a>



<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>



<script src="../scripts/config.js"></script>
<script src="../scripts/api.js"></script>
<script src="../scripts/leaguePage.js"></script>


  <!-- optional floating Bet button (keeps your original idea) -->


<script>
  // Make the league tabs navigate
  (function(){
    function go(btn){ var url = btn.getAttribute('data-href'); if(url){ location.href = url; } }
    document.querySelectorAll('.league-tabs .tab').forEach(function(btn){
      btn.addEventListener('click', function(){ go(btn); });
    });
  })();
</script>



<script>
document.addEventListener("DOMContentLoaded", () => {
  // Determine which league this page belongs to
  const path = window.location.pathname.toLowerCase();
  let league = "";
  if (path.includes("laliga")) league = "laliga";
  else if (path.includes("bundesliga")) league = "bundesliga";
  else if (path.includes("premier")) league = "premier";

  // Handle top nav clicks
  const navItems = document.querySelectorAll(".nav-item");
  navItems.forEach(item => {
    const label = item.querySelector("span").textContent.trim().toLowerCase();

    item.addEventListener("click", () => {
      if (label === "home") {
        window.location.href = `../${league}/index.html`;
      } 
      else if (label === "results") {
        window.location.href = `../${league}/results.html`;
      } 
      else if (label === "winners") {
        alert("Winners page coming soon!");
      } 
      else if (label === "rules") {
        alert("Rules page coming soon!");
      }
    });
  });

  // Handle league tab switching (La Liga / Bundesliga / Premier)
  const tabs = document.querySelectorAll(".league-tabs .tab");
  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      const target = tab.getAttribute("data-href");
      if (target) window.location.href = target;
    });
  });

  // Optional: visually mark active tab automatically
  tabs.forEach(tab => {
    const href = tab.getAttribute("data-href").toLowerCase();
    if (path.includes("laliga") && href.includes("laliga")) tab.classList.add("active");
    else if (path.includes("bundesliga") && href.includes("bundesliga")) tab.classList.add("active");
    else if (path.includes("premier") && href.includes("premier")) tab.classList.add("active");
    else tab.classList.remove("active");
  });
});
</script>
